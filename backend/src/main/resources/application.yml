spring:
  application:
    name: agrodairy-backend
  main:
    # Defers most bean creation until first use instead of all upfront at boot — the single
    # biggest lever for startup time on a CPU-throttled free-tier container, where the full
    # eager bean graph (JPA, Security, Flyway, SpringDoc, etc.) was taking 3-5+ minutes and
    # losing the race against the host's startup/port-scan timeout. The two @Scheduled beans
    # are explicitly opted back into eager init (see their @Lazy(false)) since a lazy bean's
    # @Scheduled methods never get registered until something else touches the bean first.
    lazy-initialization: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 2

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  ai-service:
    base-url: ${AI_SERVICE_URL:http://ai-service:8000}
    internal-api-key: ${INTERNAL_API_KEY}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  admin-seed:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
